<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cập nhật – NAK34</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--cream:#EFE6CF;--ink:#111;--yellow:#FFC400;--green:#1E7B34;--dgreen:#1E5E2C;--red:#D7262E}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-weight:600}
header{background:var(--dgreen);color:#fff;border-bottom:3px solid var(--ink);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font:800 26px Anton,Archivo,sans-serif;letter-spacing:.02em;flex:1 1 auto}
header small{font-weight:700;opacity:.9}
.btn{min-height:40px;padding:0 16px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:800 14px Archivo,sans-serif;box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.y{background:var(--yellow)} .btn.r{color:var(--red)} .btn.s{min-height:34px;padding:0 12px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{font:italic 800 17px 'Barlow Condensed',Archivo,sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:8px 16px;border:2px solid var(--ink);border-radius:10px;background:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tab.on{background:var(--yellow)}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:16px;margin-bottom:18px}
.card h2{margin:0 0 12px;font:800 24px Anton,Archivo,sans-serif;color:var(--green);text-shadow:2px 2px 0 var(--yellow);letter-spacing:.02em}
.card h3{margin:16px 0 8px;font-size:15px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;border-top:2px dashed #cfc7ad}
.row:first-of-type{border-top:0}
.grow{flex:1 1 220px;min-width:0}
.mut{font-size:12px;color:#555;font-weight:700}
label{display:block;font-size:12px;font-weight:800;margin:0 0 3px}
input,select,textarea{font:600 14px Archivo,sans-serif;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:#fff;min-height:40px;max-width:100%}
input[type=text],input[type=url],textarea{width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.form .wide{grid-column:1/-1}
.badge{display:inline-block;padding:2px 8px;border:2px solid var(--ink);border-radius:999px;font-size:11px;font-weight:800;background:var(--yellow)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.gate{max-width:420px;margin:80px auto;text-align:center}
</style>
</head>
<body>
<div id="gate" class="gate card"><h2>ĐANG KIỂM TRA…</h2><p>Đang xác nhận quyền quản trị.</p></div>
<div id="app" hidden>
<header>
  <h1>CẬP NHẬT · NAK34</h1>
  <small id="who"></small>
  <a class="btn y" href="/">Xem trang chủ</a>
  <button class="btn" id="logout" type="button">Đăng xuất</button>
</header>
<main>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="plan" role="tab">Kế hoạch</button>
    <button class="tab" data-tab="docs" role="tab">Tài liệu</button>
    <button class="tab" data-tab="week" role="tab">Lịch tuần</button>
    <button class="tab" data-tab="notes" role="tab">Ghi chú</button>
  </div>
  <section id="view"></section>
</main>
</div>
<div id="toast"></div>
<iframe id="baseFrame" src="/index.html" hidden title="base"></iframe>
<script src="./nak.js"></script>
<script>
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var BASE = null, tab = 'plan', docGroup = null;
  var weekSel = (function () { var n = new Date(); var o = Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(2026, 10, 1)) / 864e5); return Math.max(1, Math.min(30, Math.floor((o - 8) / 7) + 21)); })();
  var DOW = ['THỨ 2','THỨ 3','THỨ 4','THỨ 5','THỨ 6','THỨ 7','CHỦ NHẬT'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(t) { var e = $('#toast'); e.textContent = t; e.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.className = ''; }, 1800); }
  function ordToDate(o) { return new Date(Date.UTC(2026, 10, 1 + o)).toISOString().slice(0, 10); }
  function dateToOrd(s) { var p = s.split('-'); return Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - Date.UTC(2026, 10, 1)) / 864e5); }
  function dmy(o) { var d = ordToDate(o).split('-'); return d[2] + '/' + d[1]; }
  function data() { return NAK.data || {}; }
  function save(fn, msg) { return NAK.save(fn).then(function (ok) { if (ok) toast(msg || 'Đã lưu'); render(); return ok; }); }
  function cname(code) { var c = BASE.schedCourses[code]; return c ? (c.fullName || c.name) : code; }

  /* ---------- Kế hoạch ---------- */
  function viewPlan() {
    var d = data(), ts = d.taskState || {}, h = '';
    BASE.courses.forEach(function (c) {
      h += '<div class="card"><h2>' + esc(c.name) + '</h2>';
      c.tasks.forEach(function (t, i) {
        var st = ts[c.id + '|' + t.title] || 'on';
        h += '<div class="row"><div class="grow"><b>' + esc(t.title) + '</b><div class="mut">Hạn ' + dmy(t.e) + '</div></div>' +
          '<select data-act="tstate" data-c="' + c.id + '" data-i="' + i + '" aria-label="Trạng thái"><option value="on"' + (st === 'on' ? ' selected' : '') + '>Đang chạy</option><option value="done"' + (st === 'done' ? ' selected' : '') + '>Đã hoàn thành</option><option value="hidden"' + (st === 'hidden' ? ' selected' : '') + '>Ẩn</option></select></div>';
      });
      (d.tasks || []).forEach(function (t, i) {
        if (t.c !== c.id) return;
        h += '<div class="row"><div class="grow"><b>' + esc(t.title) + '</b> <span class="badge">Mới thêm</span><div class="mut">' + (t.s != null ? dmy(t.s) + ' → ' : 'Hạn ') + dmy(t.e) + '</div></div>' +
          '<label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" data-act="tdone" data-i="' + i + '"' + (t.done ? ' checked' : '') + '> Đã xong</label>' +
          '<button class="btn s r" data-act="tdel" data-i="' + i + '">Xóa</button></div>';
      });
      h += '</div>';
    });
    h += '<div class="card"><h2>THÊM NHIỆM VỤ</h2><div class="form">' +
      '<div><label>Môn</label><select id="nt-c">' + BASE.courses.map(function (c) { return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select></div>' +
      '<div class="wide"><label>Tên nhiệm vụ</label><input type="text" id="nt-t" maxlength="200"></div>' +
      '<div><label>Ngày bắt đầu (tùy chọn)</label><input type="date" id="nt-s"></div>' +
      '<div><label>Hạn nộp</label><input type="date" id="nt-e"></div>' +
      '<div><button class="btn y" data-act="tadd">Thêm</button></div></div></div>';
    return h;
  }

  /* ---------- Tài liệu ---------- */
  function viewDocs() {
    var d = data(), k = docGroup || BASE.docOrder[0], links = d.docLinks || {}, added = (d.docs || {})[k] || [];
    var h = '<div class="card"><h2>TÀI LIỆU</h2><label>Môn / nhóm</label><select id="dg">' +
      BASE.docOrder.map(function (g, i) { return '<option value="' + g + '"' + (g === k ? ' selected' : '') + '>' + esc(BASE.docNames[i]) + '</option>'; }).join('') + '</select>';
    h += '<h3>Tài liệu có sẵn – dán link Google Drive</h3>';
    (BASE.docs[k] || []).forEach(function (x, i) {
      var cur = links[k + '|' + x[1]] || x[2] || '';
      h += '<div class="row"><div class="grow"><b>' + esc(x[1]) + '</b> <span class="badge">' + esc(x[0]) + '</span></div>' +
        '<input class="grow" type="url" placeholder="https://drive.google.com/…" value="' + esc(cur) + '" data-i="' + i + '" id="dl' + i + '">' +
        '<button class="btn s y" data-act="dlsave" data-i="' + i + '">Lưu link</button></div>';
    });
    h += '<h3>Tài liệu mới thêm</h3>';
    if (!added.length) h += '<p class="mut">Chưa có.</p>';
    added.forEach(function (x, i) {
      h += '<div class="row"><div class="grow"><b>' + esc(x.name) + '</b> <span class="badge">' + esc(x.type) + '</span><div class="mut">' + esc(x.link || 'Chưa có link') + '</div></div><button class="btn s r" data-act="ddel" data-i="' + i + '">Xóa</button></div>';
    });
    h += '<h3>Thêm tài liệu</h3><div class="form"><div><label>Loại</label><select id="nd-type"><option>PDF</option><option>DOCX</option><option>PPTX</option><option>LINK</option></select></div>' +
      '<div class="wide"><label>Tên tài liệu</label><input type="text" id="nd-name" maxlength="250"></div>' +
      '<div class="wide"><label>Link</label><input type="url" id="nd-link" placeholder="https://…"></div>' +
      '<div><button class="btn y" data-act="dadd">Thêm</button></div></div></div>';
    return h;
  }

  /* ---------- Lịch tuần ---------- */
  function viewWeek() {
    var d = data(), w = weekSel, sess = BASE.sched[w] || [], ch = d.changes || {}, add = (d.added || {})[w] || [];
    var h = '<div class="card"><h2>LỊCH TUẦN</h2><label>Tuần</label><select id="ws">';
    for (var i = 1; i <= BASE.weekCount; i++) h += '<option value="' + i + '"' + (i === w ? ' selected' : '') + '>Tuần ' + i + '</option>';
    h += '</select>';
    h += '<h3>Buổi học trong tuần (sửa phòng / tiết / ghi chú đổi lịch)</h3>';
    if (!sess.length) h += '<p class="mut">Tuần này không có buổi học.</p>';
    sess.forEach(function (x, idx) {
      var c = ch[w + '-' + idx] || {}, p = c.periods || [x[2], x[3]];
      h += '<div class="row" data-idx="' + idx + '"><div style="flex:1 1 100%"><b>' + DOW[x[0]] + ' · ' + esc(cname(x[1])) + '</b> <span class="mut">(gốc: tiết ' + x[2] + '–' + x[3] + ', ' + esc(x[4]) + ')</span> ' + (ch[w + '-' + idx] ? '<span class="badge">Đã đổi</span>' : '') + '</div>' +
        '<div style="width:90px"><label>Tiết từ</label><input type="text" class="f-a" value="' + p[0] + '"></div>' +
        '<div style="width:90px"><label>đến</label><input type="text" class="f-b" value="' + p[1] + '"></div>' +
        '<div style="width:140px"><label>Phòng</label><input type="text" class="f-room" value="' + esc(c.room || x[4]) + '"></div>' +
        '<div style="width:110px"><label>Nhãn</label><input type="text" class="f-tag" value="' + esc(c.tag || 'ĐỔI LỊCH') + '"></div>' +
        '<div class="grow"><label>Ghi chú hiển thị</label><input type="text" class="f-note" value="' + esc(c.note || '') + '"></div>' +
        '<button class="btn s y" data-act="chsave" data-idx="' + idx + '">Lưu</button>' +
        (ch[w + '-' + idx] ? '<button class="btn s r" data-act="chreset" data-idx="' + idx + '">Về gốc</button>' : '') + '</div>';
    });
    h += '<h3>Buổi học bù / thêm buổi</h3>';
    add.forEach(function (a, i) {
      h += '<div class="row"><div class="grow"><b>' + DOW[a[0]] + ' · ' + esc(cname(a[1])) + '</b> <span class="badge">' + esc(a[6]) + '</span><div class="mut">Tiết ' + a[2] + '–' + a[3] + ' · ' + esc(a[4]) + (a[5] ? ' · ' + esc(a[5]) : '') + '</div></div><button class="btn s r" data-act="addel" data-i="' + i + '">Xóa</button></div>';
    });
    h += '<div class="form" style="margin-top:10px"><div><label>Thứ</label><select id="na-d">' + DOW.map(function (n, i) { return '<option value="' + i + '">' + n + '</option>'; }).join('') + '</select></div>' +
      '<div><label>Môn</label><select id="na-c">' + Object.keys(BASE.schedCourses).map(function (k) { return '<option value="' + k + '">' + esc(cname(k)) + '</option>'; }).join('') + '</select></div>' +
      '<div><label>Tiết từ</label><input type="text" id="na-a"></div><div><label>đến</label><input type="text" id="na-b"></div>' +
      '<div><label>Phòng</label><input type="text" id="na-r"></div><div><label>Nhãn</label><input type="text" id="na-t" value="HỌC BÙ"></div>' +
      '<div class="wide"><label>Ghi chú</label><input type="text" id="na-n"></div><div><button class="btn y" data-act="adadd">Thêm buổi</button></div></div></div>';
    return h;
  }

  /* ---------- Ghi chú ---------- */
  function viewNotes() {
    var n = data().notes || {}, keys = Object.keys(n), h = '<div class="card"><h2>GHI CHÚ BUỔI HỌC</h2><p class="mut">Thêm ghi chú bằng biểu tượng bút chì trên từng buổi ở trang chủ. Ở đây để xem lại và xóa.</p>';
    if (!keys.length) h += '<p>Chưa có ghi chú.</p>';
    keys.sort().forEach(function (k) {
      var p = k.split('-'), lab = 'Tuần ' + p[0] + (p[1] && /^\d$/.test(p[1]) ? ' · ' + DOW[+p[1]] : '') + (p[2] ? ' · ' + cname(p[2]) : '');
      h += '<div class="row"><div class="grow"><b>' + esc(lab) + '</b><div style="white-space:pre-line">' + esc(n[k]) + '</div></div><button class="btn s r" data-act="ndel" data-k="' + esc(k) + '">Xóa</button></div>';
    });
    return h + '</div>';
  }

  function render() {
    if (!BASE) return;
    document.querySelectorAll('.tab').forEach(function (b) { b.className = 'tab' + (b.dataset.tab === tab ? ' on' : ''); });
    $('#view').innerHTML = ({ plan: viewPlan, docs: viewDocs, week: viewWeek, notes: viewNotes })[tab]();
  }

  /* ---------- Sự kiện ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
    var a = t.dataset.act, i = +t.dataset.i, w = weekSel, k = docGroup || BASE.docOrder[0];
    if (a === 'tadd') {
      var title = $('#nt-t').value.trim(), eV = $('#nt-e').value, sV = $('#nt-s').value;
      if (!title || !eV) { toast('Cần nhập tên và hạn nộp'); return; }
      save(function (d) { d.tasks = d.tasks || []; d.tasks.push({ id: String(Date.now()), c: $('#nt-c').value, title: title, s: sV ? dateToOrd(sV) : null, e: dateToOrd(eV), done: false }); }, 'Đã thêm nhiệm vụ');
    } else if (a === 'tdel') { save(function (d) { d.tasks.splice(i, 1); }, 'Đã xóa'); }
    else if (a === 'dlsave') {
      var url = $('#dl' + i).value.trim(), name = BASE.docs[k][i][1];
      save(function (d) { d.docLinks = d.docLinks || {}; if (url) d.docLinks[k + '|' + name] = url; else delete d.docLinks[k + '|' + name]; }, 'Đã lưu link');
    } else if (a === 'ddel') { save(function (d) { d.docs[k].splice(i, 1); }, 'Đã xóa'); }
    else if (a === 'dadd') {
      var nm = $('#nd-name').value.trim(); if (!nm) { toast('Cần nhập tên tài liệu'); return; }
      save(function (d) { d.docs = d.docs || {}; (d.docs[k] = d.docs[k] || []).push({ type: $('#nd-type').value, name: nm, link: $('#nd-link').value.trim() }); }, 'Đã thêm tài liệu');
    } else if (a === 'chsave') {
      var r = t.closest('.row'), idx = t.dataset.idx, pa = parseInt(r.querySelector('.f-a').value, 10), pb = parseInt(r.querySelector('.f-b').value, 10);
      if (!(pa > 0 && pb >= pa)) { toast('Tiết không hợp lệ'); return; }
      save(function (d) { d.changes = d.changes || {}; d.changes[w + '-' + idx] = { room: r.querySelector('.f-room').value.trim(), periods: [pa, pb], note: r.querySelector('.f-note').value.trim(), tag: r.querySelector('.f-tag').value.trim() || 'ĐỔI LỊCH' }; }, 'Đã lưu thay đổi');
    } else if (a === 'chreset') { save(function (d) { delete d.changes[w + '-' + t.dataset.idx]; }, 'Đã về lịch gốc'); }
    else if (a === 'adadd') {
      var fa = parseInt($('#na-a').value, 10), fb = parseInt($('#na-b').value, 10);
      if (!(fa > 0 && fb >= fa)) { toast('Tiết không hợp lệ'); return; }
      save(function (d) { d.added = d.added || {}; (d.added[w] = d.added[w] || []).push([+$('#na-d').value, $('#na-c').value, fa, fb, $('#na-r').value.trim(), $('#na-n').value.trim(), $('#na-t').value.trim() || 'HỌC BÙ']); }, 'Đã thêm buổi');
    } else if (a === 'addel') { save(function (d) { d.added[w].splice(i, 1); }, 'Đã xóa'); }
    else if (a === 'ndel') { var key = t.dataset.k; save(function (d) { delete d.notes[key]; }, 'Đã xóa ghi chú'); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'dg') { docGroup = t.value; render(); }
    else if (t.id === 'ws') { weekSel = +t.value; render(); }
    else if (t.dataset && t.dataset.act === 'tstate') {
      var c = BASE.courses.filter(function (x) { return x.id === t.dataset.c; })[0], key = c.id + '|' + c.tasks[+t.dataset.i].title, v = t.value;
      save(function (d) { d.taskState = d.taskState || {}; if (v === 'on') delete d.taskState[key]; else d.taskState[key] = v; });
    } else if (t.dataset && t.dataset.act === 'tdone') { var i = +t.dataset.i, on = t.checked; save(function (d) { d.tasks[i].done = on; }); }
  });
  $('#logout').onclick = function () { NAK.api('/api/logout', { method: 'POST' }).then(function () { location.href = '/'; }); };

  /* ---------- Khởi động ---------- */
  function boot() {
    NAK.load().then(function () {
      if (!NAK.admin) { location.replace('/?login=1'); return; }
      $('#who').textContent = NAK.email;
      var f = $('#baseFrame'), tries = 0;
      (function wait() {
        try { if (f.contentWindow && f.contentWindow.NAK_BASE) { BASE = JSON.parse(JSON.stringify(f.contentWindow.NAK_BASE())); $('#gate').hidden = true; $('#app').hidden = false; render(); return; } } catch (_) {}
        if (++tries > 100) { $('#gate').innerHTML = '<h2>LỖI</h2><p>Không tải được dữ liệu gốc. Tải lại trang.</p>'; return; }
        setTimeout(wait, 100);
      })();
    });
  }
  boot();
})();
</script>
</body>
</html>
