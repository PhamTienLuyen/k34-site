<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cập nhật – NAK34</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800&family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--cream:#EFE6CF;--ink:#111;--yellow:#FFC400;--green:#1E7B34;--dgreen:#1E5E2C;--red:#D7262E;--font:Archivo,system-ui,sans-serif;--fs:14px;--fs-s:14px;--fs-h:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.4;font-weight:600}
button,input,select,textarea{font-family:var(--font)}
header{background:var(--dgreen);color:#fff;border-bottom:3px solid var(--ink);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font:400 var(--fs-h) Anton,Archivo,sans-serif;letter-spacing:.02em;flex:1 1 auto}
header small{font-size:var(--fs-s);font-weight:700;opacity:.9}
.btn{min-height:40px;padding:0 16px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:800 14px/1 var(--font);box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.y{background:var(--yellow)} .btn.r{color:var(--red)} .btn.s{min-height:34px;padding:0 12px}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{font:800 14px/1 var(--font);text-transform:uppercase;letter-spacing:.03em;min-height:40px;padding:0 16px;border:2px solid var(--ink);border-radius:10px;background:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tab.on{background:var(--yellow)}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:16px;margin-bottom:18px}
.card h2{margin:0 0 12px;font:400 var(--fs-h) Anton,Archivo,sans-serif;color:var(--green);text-shadow:2px 2px 0 var(--yellow);letter-spacing:.02em}
.card h3{margin:16px 0 8px;font-size:var(--fs-h);font-weight:800}
.card .sec{font-size:24px;font-weight:800;text-transform:uppercase;color:#14532D;letter-spacing:.02em;margin:0 0 6px;text-align:center;display:block}
.card h3.sec{margin:22px 0 8px}
.tk b{font-size:var(--fs-h);font-weight:800;line-height:1.25}
input.cn{font-size:var(--fs-h);font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;border-top:2px dashed #cfc7ad}
.row:first-of-type{border-top:0}
.grow{flex:1 1 220px;min-width:0}
.mut{font-size:var(--fs-s);color:#555;font-weight:700}
label{display:block;font-size:var(--fs-s);font-weight:800;margin:0 0 4px}
input,select,textarea{font:600 var(--fs)/1.3 var(--font);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:#fff;min-height:40px;max-width:100%}
input[type=text],input[type=url],textarea{width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.form .wide{grid-column:1/-1}
.badge{display:inline-block;padding:2px 8px;border:2px solid var(--ink);border-radius:999px;font-size:14px;font-weight:800;background:var(--yellow)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font:800 14px var(--font);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.gate{max-width:420px;margin:80px auto;text-align:center}
.btn.dirty{outline:3px solid var(--red);outline-offset:2px}
.tt{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.tt .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.tt .dh{background:#1A1A17;color:#FFC400;border:2px solid var(--ink);border-radius:10px;padding:6px 4px;text-align:center;font-weight:800;font-size:13px;line-height:1.25}
.tt .dh b{display:block;color:#fff;font-size:17px}
.tt .tc{display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:10px;padding:7px 8px;font:700 12px/1.35 var(--font);cursor:pointer;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.tt .tc.on{outline:3px solid var(--red);outline-offset:1px}
.tt .tc b{display:block;font-size:13px;margin:2px 0}
.tt .tc small{display:block;font-weight:700;opacity:.85}
.tt .tadd{min-height:34px;border:2px dashed var(--ink);border-radius:10px;background:#FFF9DB;font:800 12px var(--font);cursor:pointer;padding:4px}
.tt .tadd.on{background:var(--yellow);border-style:solid}
.tt .off{text-align:center;color:#888;font-weight:800;padding:10px 0;font-size:13px}
.wpanel{margin-top:16px;padding:14px;border:3px solid var(--ink);border-radius:14px;background:#FFF9DB}

.pw{background:#F6EEDA;border:3px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 #3A3A32;margin-bottom:22px}
.pw .bar{display:flex;align-items:center;gap:12px;background:#1A1A17;padding:10px 14px;border-radius:12px 12px 0 0;border-bottom:3px solid var(--ink)}
.pw .bar i{width:12px;height:12px;border-radius:50%;border:1.5px solid #000;display:inline-block;margin-right:7px}
.pw .bar span{flex:1;background:#2B2B26;border:1.5px solid #55554A;border-radius:8px;padding:3px 12px;font:italic 800 13px 'Barlow Condensed',sans-serif;letter-spacing:.05em;color:#FFC400}
.pw .bd{padding:20px 18px 22px}
.pw .ttl{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pw .ttl h2{margin:0;font:400 38px/1.05 Anton,Archivo,sans-serif;text-transform:uppercase;letter-spacing:.02em;text-shadow:3px 3px 0 #FFC400;color:var(--ink)}
.pw .nv{min-height:30px;padding:0 10px;border-radius:8px;border:2px solid var(--ink);background:#fff;box-shadow:2.5px 2.5px 0 var(--ink);font:800 15px var(--font);cursor:pointer}
.pw .nv.y{background:#FFC400}
.pw .wrap{overflow-x:auto;border:3px solid var(--ink);border-radius:16px;background:#fff}
.pw .grid{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));min-width:900px}
.pw .cell{min-width:0;min-height:380px;border-right:2px solid var(--ink);display:flex;flex-direction:column}
.pw .cell:last-child{border-right:0}
.pw .cell .hd{text-align:center;padding:10px 6px;border-bottom:3px solid var(--ink)}
.pw .cell .hd p{margin:0;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.pw .cell .hd p+p{font:800 26px/1.05 Anton,Archivo,sans-serif;letter-spacing:0;text-transform:none}
.pw .cell .bdy{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:12px}
.pw .sc{position:relative;display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:12px;padding:10px 11px;box-shadow:4px 4px 0 var(--ink);background:#fff;color:var(--ink);font:600 12px/1.35 var(--font);cursor:pointer}
.pw .pen{position:absolute;top:6px;right:6px;width:28px;height:28px;border:2px solid var(--ink);border-radius:8px;background:var(--yellow);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2}
.pw .sc.on{outline:3px solid var(--red);outline-offset:2px}
.pw .sc.hid{opacity:.45;border-style:dashed}
.pw .sc .hh{display:block;margin:-10px -11px 8px;padding:6px 8px 7px;border-bottom:2px solid var(--ink);border-radius:10px 10px 0 0;font-size:14px;font-weight:800;line-height:1.3}
.pw .sc .bu{display:block;height:16px;line-height:16px;margin-bottom:4px;text-align:center;background:#fff;border-radius:4px;font-size:9px;font-weight:800;letter-spacing:.06em}
.pw .sc .tt2{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
.pw .sc p{margin:3px 0 0}
.pw .sc .ch{position:absolute;top:-9px;left:6px;background:#D7262E;color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:1px 7px;z-index:2}
.pw .eye{display:flex;justify-content:flex-end;margin-top:8px}
.pw .eye span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:8px;box-shadow:2px 2px 0 var(--ink);background:#FFC400}
.pw .tk2{border:2px solid var(--ink);border-radius:12px;padding:10px 11px;box-shadow:4px 4px 0 var(--ink);background:#A3151C;color:#fff;font:600 12px/1.35 var(--font)}
.pw .tk2 .lb{display:block;height:18px;line-height:18px;margin-bottom:6px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.04em;border-radius:4px;background:#fff;color:#A3151C}
.pw .tk2 b{display:block;font-size:14px;line-height:1.3}
.pw .offt{margin:auto;text-align:center;font:800 22px Anton,Archivo,sans-serif;color:#6B6B6B}
.pw .addb{min-height:34px;border:2px dashed var(--ink);border-radius:10px;background:#FFF9DB;font:800 12px var(--font);cursor:pointer;padding:4px;margin-top:auto}
.pw .addb.on{background:var(--yellow);border-style:solid}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:860px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.cgrid{grid-template-columns:1fr}}
.ccard{display:flex;flex-direction:column;gap:8px;text-align:left;min-height:140px;padding:0 0 12px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;font-family:var(--font);overflow:hidden;transition:transform .1s,box-shadow .1s}
.ccard:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.ccard .bar{height:14px;border-bottom:3px solid var(--ink)}
.ccard .nm{padding:0 12px;font-size:19px;font-weight:800;line-height:1.25;color:var(--ink);word-break:break-word}
.ccard .mt{padding:0 12px;font-size:14px;font-weight:700;color:#555;margin-top:auto}
.backbar{display:flex;align-items:center;margin-bottom:14px}</style>
</head>
<body>
<div id="gate" class="gate card"><h2>ĐANG KIỂM TRA…</h2><p>Đang xác nhận quyền quản trị.</p></div>
<div id="app" hidden>
<header>
  <h1>CẬP NHẬT · NAK34</h1>
  <small id="who"></small>
  <a class="btn y" href="/">Xem trang chủ</a>
  <button class="btn" id="logout" type="button">Đăng xuất</button>
</header>
<main>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="plan" role="tab">Kế hoạch</button>
    <button class="tab" data-tab="week" role="tab">Lịch tuần</button>
    <button class="tab" data-tab="news" role="tab">Post News</button>
    <button class="tab" data-tab="mail" role="tab">Thiết lập email</button>
    <button class="btn y" id="newCourse" type="button" style="margin-left:auto">+ Tạo môn học mới</button>
  </div>
  <section id="view"></section>
</main>
</div>
<div id="toast"></div>
<iframe id="baseFrame" src="/index.html" hidden title="base"></iframe>
<script src="./nak.js"></script>
<script>
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var BASE = null, tab = 'plan', docGroup = null;
  var weekSel = (function () { var n = new Date(); var o = Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(2026, 10, 1)) / 864e5); return Math.max(1, Math.min(30, Math.floor((o - 8) / 7) + 21)); })();
  var DOW = ['THỨ 2','THỨ 3','THỨ 4','THỨ 5','THỨ 6','THỨ 7','CHỦ NHẬT'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(t) { var e = $('#toast'); e.textContent = t; e.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.className = ''; }, 1800); }
  function ordToDate(o) { return new Date(Date.UTC(2026, 10, 1 + o)).toISOString().slice(0, 10); }
  function dateToOrd(s) { var p = s.split('-'); return Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - Date.UTC(2026, 10, 1)) / 864e5); }
  function dmy(o) { var d = ordToDate(o).split('-'); return d[2] + '/' + d[1]; }
  function data() { return NAK.data || {}; }
  var planDraft = null, planDirty = false, openCourse = null, wsel = null;
  function plan() { if (!planDraft) { var d = data(); planDraft = JSON.parse(JSON.stringify({ courses: d.courses || [], tasks: d.tasks || [], taskState: d.taskState || {}, taskDates: d.taskDates || {}, taskNotes: d.taskNotes || {}, courseDocs: d.courseDocs || {}, courseSched: d.courseSched || {}, hiddenCourses: d.hiddenCourses || {} })); } return planDraft; }
  function markDirty() { planDirty = true; document.querySelectorAll('.planSave').forEach(function (b) { b.classList.add('dirty'); }); document.querySelectorAll('.dirtyTxt').forEach(function (e) { e.style.display = ''; }); }
  function stage(fn) { fn(plan()); markDirty(); render(); }
  function edit(fn) { fn(plan()); markDirty(); }
  window.addEventListener('beforeunload', function (e) { if (planDirty) { e.preventDefault(); e.returnValue = ''; } });
  function save(fn, msg) { return NAK.save(fn).then(function (ok) { if (ok) toast(msg || 'Đã lưu'); render(); return ok; }); }
  function cname(code) { var c = BASE.schedCourses[code]; return c ? (c.fullName || c.name) : code; }

  /* ---------- Kế hoạch ---------- */
  var PALETTE = [['Đỏ hồng','#F29A8F','#A3151C'],['Xanh lá','#6DBB5E','#1E7B34'],['Vàng','#F2C84B','#8A6100'],['Vàng chanh','#C8CF55','#5E6B12'],['Xanh ngọc','#7FC8B8','#1F6B5C'],['Tím','#B9A2E0','#5B3F99'],['Cam','#F5A962','#B24E0A'],['Xanh dương','#8DB8F0','#1F4F99']];
  var draft = false, lastCreated = null;
  function dateIn(cls, o, extra) { return '<input type="date" class="' + cls + '" value="' + (o == null ? '' : ordToDate(o)) + '"' + (extra || '') + '>'; }
  function palOpts(sel) { return PALETTE.map(function (p, i) { return '<option value="' + i + '"' + (p[1] === sel ? ' selected' : '') + '>' + p[0] + '</option>'; }).join(''); }
  function cleanGroup(n) { return String(n || '').replace(/^\s*nhóm\s*/i, '').trim(); }
  var P_notes = {};
  function docsBlock(cid, d) {
    var arr = (d.courseDocs || {})[cid] || [], h = '<h3 class="sec">Tài liệu</h3><div data-docs="' + cid + '">';
    arr.forEach(function (x, i) {
      h += '<div class="row cdoc" data-i="' + i + '" style="padding:6px 0"><input type="text" class="cd-n grow" maxlength="200" placeholder="Tên tài liệu" value="' + esc(x.name) + '"><input type="url" class="cd-l grow" placeholder="Link Google Drive" value="' + esc(x.link || '') + '"><button class="btn s" data-act="cdmove" data-dir="-1" data-c="' + cid + '" data-i="' + i + '" title="Lên" aria-label="Đưa lên"' + (i === 0 ? ' disabled' : '') + '>▲</button><button class="btn s" data-act="cdmove" data-dir="1" data-c="' + cid + '" data-i="' + i + '" title="Xuống" aria-label="Đưa xuống"' + (i === arr.length - 1 ? ' disabled' : '') + '>▼</button><button class="btn s r" data-act="cddel" data-c="' + cid + '" data-i="' + i + '">Xóa</button></div>';
    });
    if (!arr.length) h += '<p class="mut" style="margin:0 0 6px">Chưa có tài liệu.</p>';
    return h + '<div class="row" style="padding:6px 0"><input type="text" class="cdn-n grow" maxlength="200" placeholder="Tên tài liệu mới"><input type="url" class="cdn-l grow" placeholder="Link Google Drive"><button class="btn s y" data-act="cdadd" data-c="' + cid + '">+ Thêm</button></div></div>';
  }
  function schedBlock(cid, d) {
    d.courseSched = d.courseSched || {};
    var arr = d.courseSched[cid] = d.courseSched[cid] || [];
    arr.sort(function (x, y) { return (x.d - y.d) || (x.a - y.a); });
    var h = '<h3 class="sec">Lịch học</h3><div data-sched="' + cid + '">';
    function F(cls, label, val, w, extra) { return '<div style="' + (w ? 'width:' + w + 'px' : 'flex:1 1 150px;min-width:0') + '"><label>' + label + '</label><input type="' + (extra || 'text') + '" class="' + cls + '" value="' + esc(val == null ? '' : val) + '"' + (extra === 'date' || extra === 'time' ? '' : ' maxlength="60"') + '></div>'; }
    if (!arr.length) h += '<p class="mut" style="margin:0 0 6px">Chưa có buổi học. Thêm buổi đầu tiên ở dưới; chọn "Lặp lại" để tạo nhiều tuần cùng lúc.</p>';
    arr.forEach(function (q, i) {
      h += '<div class="srow" data-c="' + cid + '" data-i="' + i + '" style="padding:10px 0;border-top:2px dashed #cfc7ad"><div class="row" style="padding:0;border:0;align-items:flex-end">' +
        '<div style="width:160px"><label>Ngày học</label>' + dateIn('sr-d', q.d) + '</div>' + F('sr-a', 'Tiết từ', q.a, 80) + F('sr-b', 'đến', q.b, 80) + F('sr-s', 'Giờ bắt đầu', q.s, 130, 'time') +
        F('sr-r', 'Phòng', q.r, 0) + F('sr-g', 'Giảng viên', q.g, 0) + F('sr-t', 'Nhãn dán', q.t, 120) + F('sr-h', 'Đã học', q.h, 90) + '<button class="btn s r" data-act="srdel" data-c="' + cid + '" data-i="' + i + '">Xóa</button></div>' +
        '<input type="text" class="sr-n" maxlength="600" style="margin-top:6px" placeholder="Ghi chú buổi học (người xem bấm biểu tượng con mắt để đọc)" value="' + esc(q.n || '') + '"></div>';
    });
    var last = arr.length ? arr[arr.length - 1] : {};
    h += '<div style="padding:12px;border:2px dashed #cfc7ad;border-radius:12px;background:#FFF9DB;margin-top:10px"><div class="row" style="padding:0;border:0;align-items:flex-end">' +
      '<div style="width:160px"><label>Ngày học</label><input type="date" class="sa-d"></div>' + F('sa-a', 'Tiết từ', '', 80) + F('sa-b', 'đến', '', 80) + F('sa-s', 'Giờ bắt đầu', last.s || '', 130, 'time') +
      F('sa-r', 'Phòng', last.r || '', 0) + F('sa-g', 'Giảng viên', last.g || '', 0) + F('sa-t', 'Nhãn dán', '', 120) + F('sa-h', 'Đã học', '', 90) +
      '<div style="width:110px"><label>Lặp lại (số buổi)</label><input type="number" class="sa-k" min="1" max="40" value="1"></div>' +
      '<button class="btn s y" data-act="sradd" data-c="' + cid + '">+ Thêm</button></div>' +
      '<p class="mut" style="margin:8px 0 0">Số buổi &gt; 1: tạo thêm các buổi giống hệt vào cùng thứ của các tuần sau (mỗi 7 ngày). Sau đó vẫn đổi ngày từng buổi được.</p></div></div>';
    return h;
  }
  function taskForm(cid) {
    return '<div class="form" data-form="' + cid + '" style="margin-top:14px">' +
      '<div class="wide"><input type="text" class="nt-t" maxlength="200" aria-label="Tên nhiệm vụ" placeholder="Tên nhiệm vụ mới, ví dụ: Bài tập nhóm chương 3"></div>' +
      '<div><label>Ngày bắt đầu</label><input type="date" class="nt-s"></div>' +
      '<div><label>Ngày hoàn thành</label><input type="date" class="nt-e"></div>' +
      '<div><button class="btn y" data-act="tadd" data-c="' + cid + '">Thêm nhiệm vụ</button></div></div>';
  }
  function noteBox(v) { return '<div style="margin:6px 0 4px 14px"><textarea class="tk-note" maxlength="1500" rows="2" style="width:100%;box-sizing:border-box;background:#F9D2CF;border-color:#A3151C" placeholder="⭐ Ghi chú chung cho nhiệm vụ này (người xem bấm ngôi sao trên bảng tiến độ để đọc)">' + esc(v || '') + '</textarea></div>'; }
  function kindOpts(k) { return '<option value="g"' + (k === 'p' ? '' : ' selected') + '>Nhóm</option><option value="p"' + (k === 'p' ? ' selected' : '') + '>Cá nhân</option>'; }
  function groupsBlock(t, i, editable, noteVal) {
    var gs = t.groups || [], h = '<div class="grp" style="margin:6px 0 4px 14px;padding:8px 10px;background:#FFF9DB;border:2px dashed #cfc7ad;border-radius:10px">';
    gs.forEach(function (g, gi) {

      if (!dv2 || !(a2 > 0 && b2 >= a2 && b2 <= 20)) { toast('Cần có ngày học và tiết hợp lệ'); return; }
      edit(function (d) { var q = d.courseSched[sc][si]; q.d = dateToOrd(dv2); q.a = a2; q.b = b2; q.s = sr.querySelector('.sr-s').value.trim(); q.r = sr.querySelector('.sr-r').value.trim(); q.g = sr.querySelector('.sr-g').value.trim(); q.t = sr.querySelector('.sr-t').value.trim(); q.h = sr.querySelector('.sr-h').value.trim(); q.n = sr.querySelector('.sr-n').value.trim(); });
    } else if (t.id === 'dg') { docGroup = t.value; render(); }
    else if (t.id === 'ws') { weekSel = +t.value; wsel = null; render(); }
    else if (t.classList && (t.classList.contains('cn') || t.classList.contains('cend') || t.classList.contains('ccolor'))) {
      var card = t.closest('[data-course]'), cid = card.dataset.course, nm = card.querySelector('.cn').value.trim(), ev = card.querySelector('.cend').value, pal2 = PALETTE[+card.querySelector('.ccolor').value];
      if (!nm) { toast('Tên môn không được để trống'); render(); return; }
      edit(function (d) { d.courses.forEach(function (c) { if (c.id === cid) { c.name = nm; c.end = ev ? dateToOrd(ev) : null; c.color = pal2[1]; c.dark = pal2[2]; c.gv = card.querySelector('.cgv').value.trim(); } }); });
    }
    else if (t.classList && (t.classList.contains('gr-n') || t.classList.contains('gr-d') || t.classList.contains('gr-k') || t.classList.contains('gr-note'))) {
      var chip = t.closest('.gchip'), ti2 = +t.closest('.tk').dataset.i, gi = +chip.dataset.gi, gn2 = cleanGroup(chip.querySelector('.gr-n').value), gd2 = chip.querySelector('.gr-d').value, gk2 = chip.querySelector('.gr-k').value, gnt2 = chip.querySelector('.gr-note').value.trim();
      if (!gn2 || !gd2) { toast('Cần có tên nhóm và ngày'); render(); return; }
      edit(function (d) { d.tasks[ti2].groups[gi] = { n: gn2, d: dateToOrd(gd2), k: gk2, note: gnt2 }; });
    }
    else if (t.classList && (t.classList.contains('cd-n') || t.classList.contains('cd-l'))) {
      var rw = t.closest('.cdoc'), dcid3 = t.closest('[data-docs]').dataset.docs, di3 = +rw.dataset.i, nn = rw.querySelector('.cd-n').value.trim(), ll = rw.querySelector('.cd-l').value.trim();
      if (!nn) { toast('Tên tài liệu không được để trống'); render(); return; }
      edit(function (d) { d.courseDocs[dcid3][di3] = { name: nn, link: ll }; });
    }
    else if (t.classList && t.classList.contains('tk-title')) {
      var tv = t.value.trim(), ti3 = +t.closest('.tk').dataset.i;
      if (!tv) { toast('Tên nhiệm vụ không được để trống'); render(); return; }
      edit(function (d) { d.tasks[ti3].title = tv; });
    }
    else if (t.classList && t.classList.contains('tk-note')) {
      var tk = t.closest('.tk'), nv = t.value.trim();
      if (tk.dataset.kind === 'add') { var ni = +tk.dataset.i; edit(function (d) { d.tasks[ni].note = nv; }); }
      else { var bc = BASE.courses.filter(function (x) { return x.id === tk.dataset.c; })[0], nk = bc.id + '|' + bc.tasks[+tk.dataset.i].title; edit(function (d) { d.taskNotes = d.taskNotes || {}; if (nv) d.taskNotes[nk] = nv; else delete d.taskNotes[nk]; }); }
    }
    else if (t.classList && (t.classList.contains('td-s') || t.classList.contains('td-e'))) {
      var row = t.closest('.tk'), sv = (row.querySelector('.td-s') || { value: '' }).value, ev2 = row.querySelector('.td-e').value;
      if (!ev2) { toast('Cần có ngày hoàn thành'); render(); return; }
      if (sv && dateToOrd(sv) > dateToOrd(ev2)) { toast('Ngày bắt đầu phải trước ngày hoàn thành'); render(); return; }
      var so = sv ? dateToOrd(sv) : null, eo = dateToOrd(ev2);
      if (row.dataset.kind === 'add') { var ti = +row.dataset.i; edit(function (d) { d.tasks[ti].s = so; d.tasks[ti].e = eo; }); }
      else { var cc = BASE.courses.filter(function (x) { return x.id === row.dataset.c; })[0], key2 = cc.id + '|' + cc.tasks[+row.dataset.i].title; edit(function (d) { d.taskDates[key2] = { s: so, e: eo }; }); }
    }
    else if (t.dataset && t.dataset.act === 'tstate') {
      var c = BASE.courses.filter(function (x) { return x.id === t.dataset.c; })[0], key = c.id + '|' + c.tasks[+t.dataset.i].title, v = t.value;
      edit(function (d) { if (v === 'on') delete d.taskState[key]; else d.taskState[key] = v; });
    } else if (t.dataset && t.dataset.act === 'tdone') { var i = +t.dataset.i, on = t.checked; edit(function (d) { d.tasks[i].done = on; }); }
  });
  function readSchedAdd(box) {
    var dv = box.querySelector('.sa-d').value, a = parseInt(box.querySelector('.sa-a').value, 10), b = parseInt(box.querySelector('.sa-b').value, 10), k = Math.max(1, Math.min(40, parseInt(box.querySelector('.sa-k').value, 10) || 1));
    if (!dv) return 'Buổi học mới cần chọn ngày học';
    if (!(a > 0 && b >= a && b <= 20)) return 'Tiết học không hợp lệ (ví dụ 1 đến 4)';
    var st = box.querySelector('.sa-s').value.trim(), base = dateToOrd(dv), out = [];
    for (var j = 0; j < k; j++) out.push({ id: sid() + j, d: base + 7 * j, a: a, b: b, s: st, r: box.querySelector('.sa-r').value.trim(), g: box.querySelector('.sa-g').value.trim(), t: box.querySelector('.sa-t').value.trim(), h: box.querySelector('.sa-h').value.trim(), n: '' });
    return out;
  }
  function absorb(P) {
    var bad = '';
    document.querySelectorAll('[data-form]').forEach(function (f) {
      var tt = f.querySelector('.nt-t').value.trim(), ee = f.querySelector('.nt-e').value, ss = f.querySelector('.nt-s').value;
      if (!tt && !ee && !ss) return;
      if (!tt || !ee) { bad = 'Nhiệm vụ mới cần có tên và ngày hoàn thành'; return; }
      if (ss && dateToOrd(ss) > dateToOrd(ee)) { bad = 'Ngày bắt đầu phải trước ngày hoàn thành'; return; }
      P.tasks.push({ id: String(Date.now()) + Math.floor(Math.random() * 1000), c: f.dataset.form, title: tt, s: ss ? dateToOrd(ss) : null, e: dateToOrd(ee), groups: [], done: false });
    });
    document.querySelectorAll('[data-docs]').forEach(function (db) {
      var dn = db.querySelector('.cdn-n').value.trim(), dl = db.querySelector('.cdn-l').value.trim(); if (!dn && !dl) return;
      if (!dn) { bad = 'Tài liệu mới cần có tên'; return; }
      var cid = db.dataset.docs; P.courseDocs[cid] = P.courseDocs[cid] || []; P.courseDocs[cid].push({ name: dn, link: dl });
    });
    document.querySelectorAll('[data-sched]').forEach(function (box) {
      var dv = box.querySelector('.sa-d').value, av = box.querySelector('.sa-a').value.trim(), bv = box.querySelector('.sa-b').value.trim();
      if (!dv && !av && !bv) return;
      var q = readSchedAdd(box); if (typeof q === 'string') { bad = q; return; }
      var cid2 = box.dataset.sched; P.courseSched = P.courseSched || {}; P.courseSched[cid2] = (P.courseSched[cid2] || []).concat(q);
    });
    if (bad) return bad;
    document.querySelectorAll('.tk[data-kind="add"]').forEach(function (tk) {
      var gn = tk.querySelector('.g-n'), gd = tk.querySelector('.g-d'); if (!gn) return;
      var n = cleanGroup(gn.value), dd = gd.value; if (!n && !dd) return;
      if (!n || !dd) { bad = 'Nhóm/cá nhân mới cần có tên và ngày'; return; }
      var task = P.tasks[+tk.dataset.i]; task.groups = task.groups || []; task.groups.push({ n: n, d: dateToOrd(dd), k: tk.querySelector('.g-k').value, note: tk.querySelector('.g-note').value.trim() });
    });
    return bad;
  }
  function planSave() {
    var P = JSON.parse(JSON.stringify(plan())), bad = absorb(P);
    if (bad) { toast(bad); return; }
    NAK.save(function (d) { d.courses = P.courses; d.tasks = P.tasks; d.taskState = P.taskState; d.taskDates = P.taskDates; d.taskNotes = P.taskNotes; d.courseDocs = P.courseDocs; d.courseSched = P.courseSched; d.hiddenCourses = P.hiddenCourses; }).then(function (ok) {
      if (ok) { planDraft = null; planDirty = false; toast('Đã lưu'); }
      render();
    });
  }
  $('#newCourse').onclick = function () { tab = 'plan'; draft = true; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('#logout').onclick = function () { NAK.api('/api/logout', { method: 'POST' }).then(function () { location.href = '/'; }); };

  /* ---------- Khởi động ---------- */
  function boot() {
    NAK.load().then(function () {
      if (!NAK.admin) { location.replace('/?login=1'); return; }
      $('#who').textContent = NAK.email;
      var f = $('#baseFrame'), tries = 0;
      (function wait() {
        try { if (f.contentWindow && f.contentWindow.NAK_BASE) { BASE = JSON.parse(JSON.stringify(f.contentWindow.NAK_BASE())); ensureIds(NAK.data); $('#gate').hidden = true; $('#app').hidden = false; render(); return; } } catch (_) {}
        if (++tries > 100) { $('#gate').innerHTML = '<h2>LỖI</h2><p>Không tải được dữ liệu gốc. Tải lại trang.</p>'; return; }
        setTimeout(wait, 100);
      })();
    });
  }
  boot();
})();
</script>
